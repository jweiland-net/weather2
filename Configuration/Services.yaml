imports:
  - {resource: Backend/DashboardWidgets.yaml}

services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  JWeiland\Weather2\:
    resource: '../Classes/*'

  # Will be called by GeneralUtility in AjaxRoutes
  JWeiland\Weather2\Ajax\DeutscherWetterdienstWarnCellSearch:
    public: true

  # Called by makeInstance in TYPO3's PluginPreview
  JWeiland\Weather2\Backend\Preview\Weather2PluginPreview:
    public: true

  # Called by makeInstance from FlexForm
  JWeiland\Weather2\UserFunc\FlexFormUserFunc:
    public: true

  JWeiland\Weather2\Command\DeutscherWetterdienstCommand:
    tags:
      - name: console.command
        command: 'weather2:fetch:deutscherWetterdienstAPI'
        description: 'Fetch active weather warnings from Deutscher Wetterdienst for selected places and store them in weather2. Requires weather2:fetch:warnCellsFromDeutscherWetterdienstAPI to have been run before.'

  JWeiland\Weather2\Command\DeutscherWetterdienstWarnCellCommand:
    tags:
      - name: console.command
        command: 'weather2:fetch:warnCellsFromDeutscherWetterdienstAPI'
        description: 'Fetch the DWD warn cell reference list (place name <-> warn cell ID) and store it in weather2. Does not fetch actual warnings, run this before weather2:fetch:deutscherWetterdienstAPI.'

  JWeiland\Weather2\Command\OpenWeatherMapCommand:
    tags:
      - name: console.command
        command: 'weather2:fetch:fromOpenWeatherAPI'
        description: 'Fetch current weather conditions for a city from OpenWeatherMap and store them in weather2. Unrelated to the Deutscher Wetterdienst warning commands.'

  JWeiland\Weather2\Service\WeatherServiceInterface:
    class: JWeiland\Weather2\Service\OpenWeatherService

